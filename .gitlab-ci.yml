stages:
  - build
  - test
  - docker

# ─────────────────────────────
# GLOBAL VARIABLES
# ─────────────────────────────
variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

# ─────────────────────────────
# CACHE
# ─────────────────────────────
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .nuget/packages/
    - Kovix/node_modules/

# ─────────────────────────────
# BACKEND (.NET)
# ─────────────────────────────

backend_build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  tags:
    - student
  before_script:
    - cd Movie.API
  script:
    - dotnet restore
    - dotnet build --configuration Release --no-restore
  artifacts:
    paths:
      - Movie.API/bin/
      - Movie.API/obj/
    expire_in: 1 hour

backend_test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  tags:
    - student
  dependencies:
    - backend_build
  before_script:
    - cd Movie.API
  script:
    - dotnet test --configuration Release --no-build --verbosity normal

dotnet_format:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  tags:
    - student
  before_script:
    - cd Movie.API
  script:
    - dotnet restore
    - dotnet format --verify-no-changes || true
  allow_failure: true

security_dotnet:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  tags:
    - student
  before_script:
    - cd Movie.API
  script:
    - dotnet restore
    - dotnet list package --vulnerable --include-transitive || true
  allow_failure: true

# ─────────────────────────────
# FRONTEND (React / Vite / Vitest)
# ─────────────────────────────

frontend_build:
  stage: build
  image: node:20
  tags:
    - student
  before_script:
    - cd Kovix
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - Kovix/dist/
    expire_in: 1 hour

frontend_test:
  stage: test
  image: node:20
  tags:
    - student
  dependencies:
    - frontend_build
  before_script:
    - cd Kovix
  script:
    - npm ci
    - npx vitest run || true
  allow_failure: true

js_lint:
  stage: test
  image: node:20-alpine
  tags:
    - student
  before_script:
    - cd Kovix
  script:
    - npm ci
    - npm run lint || true
  allow_failure: true

security_npm:
  stage: test
  image: node:20-alpine
  tags:
    - student
  before_script:
    - cd Kovix
  script:
    - npm ci
    - npm audit --audit-level=high || true
  allow_failure: true

# ─────────────────────────────
# DOCKER VALIDATION
# ─────────────────────────────

docker_validate:
  stage: docker
  image: docker:27
  tags:
    - student
  script:
    - docker compose -f docker-compose.yml config
    - docker compose -f docker-compose-dev.yml config