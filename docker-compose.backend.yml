services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_kovix_prod
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  backend:
    build:
      context: ./Movie.API
    container_name: kovix_api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=KovixDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - Cors__AllowedOrigins=https://denysenko.netlify.app;http://localhost:3000;http://localhost:5173
    depends_on:
      - db

volumes:
  mssql_data:
